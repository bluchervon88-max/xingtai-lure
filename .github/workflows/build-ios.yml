# 在 GitHub 的 macOS runner 上构建未签名 IPA
#
# ================================================================ 为什么是"未签名"
#
# iOS 上装 App 必须有签名，而签名要 Apple 开发者证书。证书分两种：
#
#   · 正式证书（$99/年 Apple Developer Program）—— 签名可以管一年，能上架
#   · 免费 Apple ID 自签 —— 只能管 7 天，且最多 3 个 App，不能上架
#
# 本项目是自用工具，走免费路线。做法是把工作拆开：
#
#   GitHub Actions（这里）  只负责**编译**，产出一个未签名的 IPA
#   手机上的工具           负责**签名**，用用户自己的免费 Apple ID
#     （AltStore / Sideloadly 都行，装在 Windows 上即可）
#
# 好处是开发者不需要 Mac、不需要 $99、不需要碰用户的 Apple ID 和密码。
#
# ================================================================ 为什么用 xcodebuild archive 而不是 build
#
# 试过 `xcodebuild build`，问题是产物路径依赖 SDK 和配置组合，容易找不到。
# `archive` 的产物路径是固定的：
#
#     <archivePath>/Products/Applications/XtLure.app
#
# 稳定得多，代价是多花一点时间打包 xcarchive（对 4 分钟的构建可以忽略）。
#
# ================================================================ 关键编译参数
#
#   CODE_SIGNING_ALLOWED=NO      完全不做签名
#   CODE_SIGNING_REQUIRED=NO     不要求签名
#   CODE_SIGN_IDENTITY=""        清空签名身份
#   CODE_SIGN_ENTITLEMENTS=""    清空权限描述文件
#
# 四个都要给。少给一个 xcodebuild 就会去找证书，在没有配置证书的 CI 上失败。
#
#   -destination 'generic/platform=iOS'
#       "generic" 表示不针对某台具体设备编译。若写具体机型名，
#       runner 上没有那台设备会直接报错。
#
# ================================================================ 成本说明（重要）
#
# GitHub Actions 的 macOS runner 计费规则：
#
#   公开仓库  →  完全免费、无限时长
#   私有仓库  →  免费额度 2000 分钟/月，但 macOS 按 **10 倍** 计费，
#                实际只有约 200 分钟 ≈ 20 次构建
#
# 开发期一天要跑好几次构建，私有仓库的额度根本不够。
# 所以这个仓库需要是公开的 —— 但仓库里不能有任何密钥。
# 本工作流刻意不接触任何签名材料，就是为了这个。

name: Build iOS IPA (unsigned)

on:
  # 手动触发：在 Actions 页面点 "Run workflow"
  workflow_dispatch:
    inputs:
      note:
        description: '本次构建的备注（方便在产物列表里区分）'
        required: false
        default: ''
  # 推送到 main 且改动涉及 iOS 相关路径时自动构建
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'testdata/**'
      - 'tools/*.js'
      - 'tools/*.py'
      - '.github/workflows/build-ios.yml'

# 同一分支上新的构建会取消旧的，省额度
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ================================================================ 逻辑层契约测试
  #
  # 在 Linux 上跑，只花 1 倍额度，很便宜。
  # 目的是在编译 iOS 之前**先确认逻辑层没被改坏** ——
  # 契约测试（vectors.json）是 Java 和 Swift 两个实现共同遵守的单一来源，
  # 它挂了就没必要花 macOS 的额度了。
  contract-test:
    name: 跨语言契约测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'

      - name: 同步 iOS 源码
        run: node ios/sync-sources.js

      - name: 检查同步结果无差异
        # 如果同步后 git 有变化，说明有人直接改了生成物或忘了跑同步脚本
        run: |
          if [ -n "$(git status --porcelain ios/XtLure/Core)" ]; then
            echo "::error::ios/XtLure/Core 与单一来源不一致。请运行 node ios/sync-sources.js 后提交。"
            git status --porcelain ios/XtLure/Core
            exit 1
          fi

      - name: 编译并运行契约测试
        run: |
          swiftc -O \
            ios/Sources/XtLureCore/*.swift \
            ios/Sources/VectorTest/*.swift \
            -o /tmp/vectortest
          /tmp/vectortest

  # ================================================================ 构建未签名 IPA
  build-ipa:
    name: 构建未签名 IPA
    runs-on: macos-15
    timeout-minutes: 40
    needs: contract-test
    steps:
      - uses: actions/checkout@v4

      - name: 同步 iOS 源码
        run: node ios/sync-sources.js

      - name: 显示环境
        run: |
          echo "Xcode 版本:"
          xcodebuild -version
          echo ""
          echo "可用 SDK:"
          xcodebuild -showsdks | grep -i ios || true
          echo ""
          echo "可用的 iOS 模拟器:"
          xcrun simctl list devices available | grep -i iphone | head -10 || true

      # ================================================================ 模拟器上跑诊断测试
      #
      # ★ 这一步为什么重要
      #
      #   开发机是 Windows，看不到 iPhone 屏幕。**诊断模块是唯一的观测通道** ——
      #   它把视图层级和实测尺寸写成文件，用户从「文件」App 导出后发给开发者。
      #
      #   但诊断代码依赖 UIKit，在 Windows 上一行都跑不了。
      #   如果它写不出文件，用户装到真机上按了按钮也拿不到任何东西，
      #   而开发者只能干等一轮（一次真机往返 = 用户手动装 IPA + 操作 + 发文件）。
      #
      #   所以在模拟器上**真正启动 App**，验证：App 不崩、诊断文件确实被写出、
      #   报告内容结构正确。测试还会把报告全文打印到日志里 ——
      #   这样在还没有真机的时候，就能先"看见"一次真实运行时的布局数据。
      #
      # ★ 为什么放在 archive 之前
      #
      #   这一步编译的是 Debug + 模拟器 SDK，比 archive 快得多。
      #   如果 App 本身编译不过或启动就崩，先在这里失败，
      #   省掉后面 archive + 打包 + 上传的几分钟。
      - name: 诊断测试（模拟器）
        run: |
          set -o pipefail
          # 选一台可用的 iPhone 模拟器。不写死机型 ——
          # 不同 macOS runner 镜像预装的模拟器不一样，写死了会因"设备不存在"而失败。
          DEVICE=$(xcrun simctl list devices available \
            | grep -oE 'iPhone [0-9A-Za-z ()]+ \(' | head -1 | sed 's/ ($//' | sed 's/ *$//')
          if [ -z "$DEVICE" ]; then
            echo "::error::找不到可用的 iPhone 模拟器"
            xcrun simctl list devices available
            exit 1
          fi
          echo "使用模拟器: $DEVICE"
          xcodebuild test \
            -project ios/XtLure.xcodeproj \
            -scheme XtLure \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -150

      - name: 构建归档（不签名）
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/XtLure.xcodeproj \
            -scheme XtLure \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/XtLure.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | tail -60

      - name: 打成 IPA
        # IPA 就是一个 zip：根目录下有个 Payload/ 文件夹，里面是 .app。
        # 这里没有签名步骤 —— 签名留到手机上做（见文件头说明）。
        run: |
          APP="$RUNNER_TEMP/XtLure.xcarchive/Products/Applications/XtLure.app"
          if [ ! -d "$APP" ]; then
            echo "::error::归档里找不到 XtLure.app，实际内容："
            find "$RUNNER_TEMP/XtLure.xcarchive/Products" -maxdepth 3
            exit 1
          fi
          echo "App 内容:"
          ls -la "$APP"
          echo ""
          echo "可执行文件架构:"
          lipo -info "$APP/XtLure" || file "$APP/XtLure"

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          # ditto 而不是 zip：ditto 保留符号链接和资源分支，
          # 用普通 zip 打包 .app 常导致安装后启动崩溃。
          ditto -c -k --sequesterRsrc --keepParent Payload XtLure-unsigned.ipa
          echo ""
          echo "IPA 大小:"
          ls -lh XtLure-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: XtLure-unsigned-ipa
          path: ${{ runner.temp }}/XtLure-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
